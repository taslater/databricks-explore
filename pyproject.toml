[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "databricks-explore"
dynamic = ["version"]  # defined once, as __version__ in src/databricks_explore/__init__.py
description = "Local Unity Catalog explorer: browse tables, draw relationships and run queries on a canvas."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Slater" }]
requires-python = ">=3.11"
keywords = ["databricks", "unity-catalog", "sql", "lineage", "data-catalog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "flask>=3.0",
    "databricks-sdk>=0.40",
    "sqlglot>=30",
    "pydantic>=2.7",
    "pyyaml>=6",
    "pillow>=10.1",
    "platformdirs>=4",
]

[project.urls]
Homepage = "https://github.com/taslater/databricks-explore"
Issues = "https://github.com/taslater/databricks-explore/issues"
Changelog = "https://github.com/taslater/databricks-explore/releases"

[project.scripts]
databricks-explore = "databricks_explore.cli:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4"]

[tool.hatch.version]
path = "src/databricks_explore/__init__.py"

# The built web UI (npm run build writes it here) is git-ignored but belongs in the wheel and the sdist.
[tool.hatch.build]
artifacts = ["src/databricks_explore/web_dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/databricks_explore"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/web",
    "/tests",
    "/contracts",
    "/scripts",
    "/hatch_build.py",
    "/map_project.py",
    "/AGENTS.md",
    "/README.md",
    "/LICENSE",
]

# Builds the web UI when src/databricks_explore/web_dist is missing (needs Node 22 and npm); see hatch_build.py.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
